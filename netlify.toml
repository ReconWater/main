[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# /admin/ is a real Vite entry point (dist/admin/index.html).
# Only canonicalize the slash; do not rewrite admin back to the storefront index.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
